<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qois Octava — Messy data in. Working systems out.</title>
  <meta name="description" content="Portfolio of Muhammad Qois Huzyan Octava — M.Eng. Information Engineering graduate working in data engineering, applied ML & speech recognition." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B457F'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%23FFD42B'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <!-- Aksen blob gold dari desain FigCraft (640px, kanan atas) -->
  <div class="accent-blob" aria-hidden="true"></div>

  <!-- Dim backdrop (opacity diset dari data/site.json) -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Navbar / desktop "taskbar" -->
  <header class="navbar" id="navbar">
    <a class="navbar__brand" href="#" id="brand"></a>
    <nav class="navbar__links" id="nav-links" aria-label="Open windows"></nav>
  </header>

  <!-- Hero / desktop wallpaper -->
  <main class="hero">
    <div class="hero__inner">
      <div class="hero__left">
        <div class="badge"><span class="badge__dot"></span><span id="badge-text"></span></div>
        <h1 class="hero__headline" id="headline"></h1>
        <p class="hero__intro" id="intro"></p>

        <div class="hero__buttons" id="hero-buttons">
          <div class="dropdown-anchor">
            <button class="btn btn--gold" id="btn-menu">
              <span data-bind></span>
            </button>
            <!-- Dropdown menu mini-window -->
            <div class="menu" id="menu" hidden>
              <div class="menu__bar"><span class="menu__title" id="menu-title"></span><span class="menu__sq"></span></div>
              <ul class="menu__list" id="menu-items"></ul>
            </div>
          </div>
          <a class="btn btn--outline" id="btn-cv" data-bind></a>
        </div>

        <div class="hero__contact" id="hero-contact"></div>
        <div class="hero__stats" id="hero-stats"></div>
      </div>

      <div class="hero__right">
        <div class="photo-card">
          <img class="photo-card__img" src="assets/photo.jpg" alt="Qois presenting fine-tuned Whisper research at ICAICTA 2025" />
          <div class="photo-card__chip">FINE-TUNED WHISPER · ICAICTA 2025</div>
        </div>
      </div>
    </div>

    <div class="hero__hint" id="hero-hint">OPEN A WINDOW ▾ FROM THE NAVBAR</div>
  </main>

  <footer class="footer">
    <span id="footer-left"></span>
    <span id="footer-right"></span>
  </footer>

  <!-- ===== Windows (isi di-render dari data/*.json) ===== -->
  <section class="window" id="win-about" data-index="0" hidden></section>
  <section class="window" id="win-projects" data-index="1" hidden></section>
  <section class="window" id="win-publications" data-index="2" hidden></section>
  <section class="window" id="win-contact" data-index="3" hidden></section>

  <!-- Mobile hint strip -->
  <div class="mobile-hint">OPEN A WINDOW ▾ ABOUT · PROJECTS · PUBLICATIONS · CONTACT</div>

  <script src="main.js?v=4"></script>
</body>
</html>
